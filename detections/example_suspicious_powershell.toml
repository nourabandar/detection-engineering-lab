rule_id = "local-demo-suspicious-powershell"
name = "Demo - Suspicious PowerShell Encoded Command"
description = "Educational query for PowerShell command lines with an encoded-command flag."
index = ["winlogbeat-*"]
language = "kuery"
query = "process.name : \"powershell.exe\" and process.command_line : *-enc*"
